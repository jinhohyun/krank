name: K-Rank Weekly Data Auto-Update

on:
  schedule:
    - cron: '0 15 * * 0'  # Every Monday at 00:00 KST (Sunday 15:00 UTC)
  workflow_dispatch:

jobs:
  update-rankings:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 01_Biz_Projects/krank_mvp/requirements.txt

      - name: Run K-Score Calculation & Sync
        run: |
          python 01_Biz_Projects/krank_mvp/database.py
          python 01_Biz_Projects/krank_mvp/test_krank.py

      - name: Commit & Push updated database
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add 01_Biz_Projects/krank_mvp/krank.db
          git commit -m "chore: K-Rank weekly data & K-Score auto-update" || exit 0
          git push
